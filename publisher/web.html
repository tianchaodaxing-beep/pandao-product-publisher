<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>商品发布 · PANDAO</title>
<style>
:root{--ink:#183247;--muted:#5c7283;--paper:#eef3f7;--white:#fff;--blue:#235ee9;--line:#d6e1ea;--good:#147d60;--bad:#b43d30}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 "Microsoft YaHei","PingFang SC",sans-serif}header{padding:22px max(24px,calc((100vw - 1180px)/2));background:var(--ink);color:white;display:flex;align-items:center;justify-content:space-between}.brand{letter-spacing:.16em;font-size:14px}header span{font-size:13px;opacity:.75}main{max-width:1180px;margin:42px auto;padding:0 24px}.intro h1{font-size:36px;letter-spacing:-.04em;margin:0}.intro p{color:var(--muted);margin:8px 0 28px}.flow{display:flex;gap:0;margin-bottom:28px;list-style:none;padding:0;border-bottom:1px solid var(--line)}.flow li{flex:1;padding:12px 0;color:var(--muted);border-bottom:3px solid transparent}.flow li.active{border-color:var(--blue);color:var(--blue);font-weight:bold}.layout{display:grid;grid-template-columns:350px 1fr;gap:24px}.panel{background:white;padding:26px;border:1px solid var(--line);border-radius:12px}h2{margin:0 0 20px;font-size:19px}label{display:block;margin:16px 0 7px;font-size:14px;font-weight:600}input,select{width:100%;border:1px solid #aebfcd;border-radius:6px;padding:11px;color:var(--ink);background:white;font:inherit}input:focus-visible,select:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid #90b3ff;outline-offset:2px}button{border:0;border-radius:6px;padding:12px 16px;background:var(--blue);color:white;font:600 15px "Microsoft YaHei",sans-serif;cursor:pointer;margin-top:22px;width:100%}button.secondary{background:var(--ink)}button:disabled{opacity:.5;cursor:wait}.hint{font-size:13px;color:var(--muted);margin-top:10px}.empty{min-height:300px;display:grid;place-content:center;color:var(--muted);text-align:center}.empty svg{margin:0 auto 16px;color:#8da9be}.count{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:18px}.count strong{font-size:23px}.tablewrap{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:14px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{color:var(--muted);font-weight:500}.error{color:var(--bad);padding:13px;background:#fff0ed;border-radius:6px}.good{color:var(--good)}.detail{display:block;color:var(--muted);font-size:12px}.actions{display:flex;gap:12px}.actions button{width:auto;flex:1}.hidden{display:none}a{color:var(--blue)}#message{margin:16px 0;overflow-wrap:anywhere}footer{font-size:13px;color:var(--muted);margin:24px 0}.path{font-size:12px;overflow-wrap:anywhere}details{font-size:13px;color:var(--muted);margin-top:12px}summary{cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere}@media(max-width:820px){main{margin-top:24px}.layout{grid-template-columns:1fr}.intro h1{font-size:28px}.flow{font-size:13px}.panel{padding:20px}header{padding:18px 24px}.count{gap:12px;flex-wrap:wrap}}
</style></head><body><header><b class="brand">PANDAO</b><span>商品发布</span></header><main><div class="intro"><h1>把商品资料交给店铺</h1><p>批量上传图片、填写商品与规格，查看每个商品的执行结果。</p></div><ol class="flow"><li class="active" id="step1">选择资料</li><li id="step2">核对清单</li><li id="step3">查看结果</li></ol><div class="layout"><section class="panel"><h2>准备这批商品</h2><form id="form"><label for="source">商品资料文件夹</label><input id="source" required placeholder="粘贴资料文件夹路径"><label for="shop">店铺配置文件</label><input id="shop" required placeholder="粘贴店铺配置文件路径"><label for="mode">执行方式</label><select id="mode"><option value="draft">保存草稿</option><option value="publish">发布商品／提交审核</option></select><button id="prepare" type="submit">生成发布清单</button></form><p class="hint">支持 Coupang、WooCommerce。首次使用请按使用说明配置店铺和图片库。</p></section><section class="panel"><div class="count"><h2 id="heading">商品清单</h2><strong id="total"></strong></div><div id="empty" class="empty"><svg width="60" height="60" viewBox="0 0 64 64" fill="none" aria-hidden="true"><path d="M12 18h40v34H12zM20 18v-7h24v7M24 30h16M24 39h16" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/></svg><div>选择商品资料，生成本次清单。</div></div><div id="table" class="tablewrap hidden"></div><p id="message" aria-live="polite"></p><p id="folder" class="path"></p><div id="actions" class="actions hidden"><button id="run" class="secondary">按清单执行</button></div></section></div><footer>请核对商品、售价、库存及目标店铺。Coupang 商品提交后，以平台审核状态为准。</footer></main><script>
const token='__TOKEN__', $=id=>document.getElementById(id);let planId=null, busy=false;
const escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(url,data){const r=await fetch(url,{method:data?'POST':'GET',headers:{'X-Pandao-Token':token,'Content-Type':'application/json'},body:data?JSON.stringify(data):undefined});const value=await r.json();if(!r.ok)throw Error(value.error||'操作未完成，请重试');return value;}
function message(text,error=false){$('message').textContent=text;$('message').className=error?'error':'';}
function step(n){[1,2,3].forEach(i=>$('step'+i).classList.toggle('active',i===n));}
function lock(flag){busy=flag;$('prepare').disabled=flag;$('run').disabled=flag;}
$('form').addEventListener('submit',async e=>{e.preventDefault();if(busy)return;lock(true);planId=null;$('actions').classList.add('hidden');message('正在整理商品资料…');try{const p=await api('/api/plan',{source:$('source').value,shop:$('shop').value,mode:$('mode').value});planId=p.id;$('empty').classList.add('hidden');$('table').classList.remove('hidden');$('total').textContent=p.products.length+' 个商品';$('heading').textContent=p.shop;$('table').innerHTML='<table><thead><tr><th>商品</th><th>售价／库存</th><th>图片</th></tr></thead><tbody>'+p.products.map(x=>'<tr><td>'+escape(x.title)+'<span class="detail">'+escape(x.sku)+'</span></td><td>'+ (x.variants.length?x.variants.map(v=>escape(Object.values(v.attributes).join(' / '))+': '+escape(v.price)+' / '+escape(v.stock)).join('<br>'):escape(x.price)+' / '+escape(x.stock))+'</td><td>'+x.image_count+' 张</td></tr>').join('')+'</tbody></table>';$('folder').textContent='清单已保存：'+p.folder;$('actions').classList.remove('hidden');message(p.mode==='draft'?'核对后将保存为店铺草稿。':'核对后将发布商品；Coupang 将提交审核。');step(2);}catch(e){message(e.message,true);}finally{lock(false);}});
$('run').addEventListener('click',async()=>{if(busy||!planId)return;lock(true);message('正在执行，请保留此页面。');try{await api('/api/run',{id:planId});while(true){await new Promise(r=>setTimeout(r,1800));const job=await api('/api/job/'+planId);if(job.status==='running')continue;if(job.status==='failed')throw Error(job.error);const r=job.report;$('heading').textContent='执行结果';$('total').textContent=r.passed+' / '+r.total+' 已核对';$('table').innerHTML='<table><thead><tr><th>商品</th><th>状态</th><th>结果</th></tr></thead><tbody>'+r.results.map(x=>{let link='';try{const u=new URL(x.url);if(u.protocol==='https:'||u.hostname==='127.0.0.1')link='<a href="'+escape(u.href)+'" target="_blank" rel="noopener noreferrer">查看商品</a>';}catch{}return '<tr><td>'+escape(x.title)+'<span class="detail">'+escape(x.sku)+'</span></td><td class="'+(x.ok?'good':'')+'">'+escape(x.status)+'</td><td>'+(x.id?'编号 '+escape(x.id)+'<br>':'')+link+escape(x.error||'')+'</td></tr>';}).join('')+'</tbody></table>';message(r.complete?'这批商品已完成核对。':'部分商品未完成，请按结果处理后点击“再次执行”。',!r.complete);$('folder').textContent='结果已保存：'+job.folder;$('run').textContent='再次执行';step(3);break;}}catch(e){message(e.message,true);}finally{lock(false);}});
</script></body></html>
